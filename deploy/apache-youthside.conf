# [MODÜL: APACHE REVERSE PROXY — ÖRNEK VHOST]
# Amaç: TLS'i Apache'de sonlandırıp istekleri Docker'daki Node sürecine (127.0.0.1:4321) iletmek.
# Gerekli modüller: a2enmod proxy proxy_http headers ssl rewrite deflate (varsa brotli)
#
# Not: /_astro/* (hash'li) dosyalara Node zaten "Cache-Control: public, max-age=31536000, immutable" ekler;
# Apache'de yalnızca hash'siz /fonts/* için kural vardır.

<VirtualHost *:80>
    ServerName youthside.co
    ServerAlias www.youthside.co
    RewriteEngine On
    RewriteRule ^ https://youthside.co%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName youthside.co
    ServerAlias www.youthside.co

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/youthside.co/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/youthside.co/privkey.pem

    # Astro, Actions'ın origin kontrolü ve canonical adresler için gerçek host/protokolü bilmeli.
    # (astro.config.mjs → security.allowedDomains ile eşleşmeli)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:4321/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:4321/

    # /fonts/* (otomatik CV fontları) hash'siz statik dosyalardır; Node max-age=0 döner.
    # Yalnızca CV üretilirken indirildikleri için 30 gün önbellek yeterli ve güvenli.
    <LocationMatch "^/fonts/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>

    # Metin yanıtlarını sıkıştır (HTML, JS, CSS, JSON). mod_brotli varsa önce o kullanılır.
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/css application/javascript application/json image/svg+xml text/plain application/xml
    </IfModule>
    <IfModule !mod_brotli.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml text/plain application/xml
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/youthside-error.log
    CustomLog ${APACHE_LOG_DIR}/youthside-access.log combined
</VirtualHost>
